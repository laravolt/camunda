name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.dependency-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        dependency-version: [prefer-lowest, prefer-stable]
        include:
          - laravel: '12.*'
            testbench: '^10.0'
          - laravel: '13.*'
            testbench: '^11.0'
        exclude:
          # Laravel 13 / orchestra/testbench 11 require PHP ^8.3.
          - php: '8.2'
            laravel: '13.*'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: simplexml, dom, curl, mbstring
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: |
          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update --no-interaction
          composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction --no-progress

      - name: Installed versions
        run: |
          composer show --direct
          composer show laravel/framework | grep -E '^versions'

      - name: Lint src/ for compile-time deprecations
        run: |
          out=$(find src -name '*.php' -print0 | xargs -0 -n 50 php -d error_reporting=-1 -d display_errors=stderr -l 2>&1 >/dev/null | grep -E 'Deprecated|Parse error' || true)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

      - name: Run tests (without Camunda server)
        run: vendor/bin/phpunit --exclude-group integration
